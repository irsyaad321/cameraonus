<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Publik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #f3f4f6; --primary-font: 'Poppins', sans-serif; --primary-color: #d946ef; }
        body { font-family: var(--primary-font); background-color: var(--bg-color); }
        .masonry-grid { column-count: 2; column-gap: 1rem; padding: 1rem; }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; background: white; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-top: 4px solid var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold" style="color: var(--primary-color);">Memori Kolektif</h1>
            <button onclick="window.location.href='index.html'" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold"> + Tambah Foto </button>
        </div>
    </header>
    <div class="max-w-7xl mx-auto mt-6">
        <div id="loader" class="spinner"></div>
        <div id="galleryGrid" class="masonry-grid"></div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE ANDA DISINI:
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyq4fF20KiPeJ_ZqzjFGJ69SMHeZKnJB9chTREfl49akfGeBs4QTCl5SSraHqDifsxUhQ/exec";

        async function loadGallery() {
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                const grid = document.getElementById('galleryGrid');
                document.getElementById('loader').style.display = 'none';

                if(data.length === 0) {
                    grid.innerHTML = '<p class="text-center text-gray-500 w-full mt-10">Belum ada foto.</p>';
                    return;
                }

                // Render instan berkat CDN murni
                data.forEach(item => {
                    const timeString = new Date(item.timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                    const card = `
                        <div class="masonry-item">
                            <img src="${item.url}" class="w-full object-cover" loading="lazy" alt="Foto">
                            <div class="p-4">
                                <p class="text-sm font-bold text-gray-800">${item.nama}</p>
                                ${item.pesan ? `<p class="text-xs text-gray-600 mt-1 italic">"${item.pesan}"</p>` : ''}
                                <p class="text-[10px] text-gray-400 mt-2 text-right">${timeString}</p>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('galleryGrid').innerHTML = '<p class="text-center text-red-500 w-full mt-10">Gagal memuat galeri.</p>';
            }
        }
        window.onload = loadGallery;
    </script>
</body>
</html>

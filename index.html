<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Foto Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-font: 'Poppins', sans-serif; --primary-color: #d946ef; }
        body { font-family: var(--primary-font); background-color: #f3f4f6; }
        .btn-gradient { background: linear-gradient(135deg, #d946ef, #8b5cf6); color: white; transition: transform 0.2s; }
        .btn-gradient:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-2" style="color: var(--primary-color);">Bagikan Momen!</h2>
        <p class="text-center text-gray-500 text-sm mb-6">Jepret foto terbaikmu di acara ini</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Anda (Wajib)</label>
                <input type="text" id="nama" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Contoh: Budi & Istri">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Pesan Singkat (Opsional)</label>
                <textarea id="pesan" rows="2" class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Tulis harapan atau kesan..."></textarea>
            </div>

            <!-- Input Kamera Tersembunyi -->
            <input type="file" id="kamera" accept="image/*" capture="environment" style="display: none;">

            <button id="btnKamera" class="w-full btn-gradient py-3 rounded-xl font-bold text-lg shadow-lg flex justify-center items-center gap-2">
                📸 Buka Kamera & Jepret
            </button>
            
            <div id="statusArea" class="text-center mt-4 hidden">
                <p id="statusText" class="text-sm font-semibold text-gray-600 animate-pulse">Mengunggah foto, mohon tunggu...</p>
            </div>
            
            <button id="btnGaleri" onclick="window.location.href='galeri.html'" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold mt-4 hidden">
                ✅ Selesai & Lihat Galeri
            </button>
        </div>
    </div>

   <script>
        // MASUKKAN DATA CLOUDINARY DAN GOOGLE ANDA DISINI:
        const CLOUD_NAME = "yhhytd9r"; 
        const UPLOAD_PRESET = "galeri_event"; // contoh: galeri_event
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyq4fF20KiPeJ_ZqzjFGJ69SMHeZKnJB9chTREfl49akfGeBs4QTCl5SSraHqDifsxUhQ/exec";

        const btnKamera = document.getElementById('btnKamera');
        const inputKamera = document.getElementById('kamera');
        const statusArea = document.getElementById('statusArea');
        const statusText = document.getElementById('statusText');
        const btnGaleri = document.getElementById('btnGaleri');

        btnKamera.addEventListener('click', () => {
            if(!document.getElementById('nama').value) {
                alert("Mohon isi Nama Anda terlebih dahulu!");
                return;
            }
            inputKamera.click();
        });

        inputKamera.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            btnKamera.style.display = 'none';
            statusArea.style.display = 'block';

            try {
                // 1. Kompresi Gambar
                statusText.innerText = "Mengompresi gambar (Kualitas Premium)...";
                const compressedBase64 = await compressImage(file);

                // 2. Upload ke Cloudinary (Server Enterprise Anti-Blokir)
                statusText.innerText = "Mengunggah ke server aman...";
                const formData = new FormData();
                formData.append('file', compressedBase64);
                formData.append('upload_preset', UPLOAD_PRESET);
                
                const cloudinaryRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const cloudinaryData = await cloudinaryRes.json();
                
                if (!cloudinaryData.secure_url) throw new Error("Gagal upload ke Cloudinary");
                
                const publicImageUrl = cloudinaryData.secure_url; // URL Publik dari Cloudinary

                // 3. Simpan Data ke Google Sheets (beserta instruksi Backup ke Drive)
                statusText.innerText = "Menyimpan ke buku tamu & arsip Drive...";
                const payload = {
                    nama: document.getElementById('nama').value,
                    pesan: document.getElementById('pesan').value,
                    url: publicImageUrl
                };

                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });

                statusText.innerText = "Foto berhasil diunggah!";
                statusText.classList.remove('animate-pulse', 'text-gray-600');
                statusText.classList.add('text-green-600');
                btnGaleri.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusText.innerText = "Terjadi kesalahan koneksi. Silakan muat ulang.";
                statusText.classList.remove('animate-pulse');
                statusText.classList.add('text-red-500');
                btnKamera.style.display = 'flex';
            }
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        }
    </script>
